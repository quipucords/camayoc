---
# General settings. They cover main infrastructure that camayoc interacts
# with and camayoc itself.

# Camayoc test framework settings
camayoc: {}

# Quipucords / Discovery server
# Settings below allow you to connect to quipucords development server
# running locally.
# If you run Discovery server locally in container, set the port to 443
# and https to true. Keep ssl-verify as false, unless you've set up the
# certificates.
quipucords_server:
    hostname: '127.0.0.1'
    https: false
    port: 8000
    ssl-verify: false
    # credentials for logging into the server
    username: 'admin'
    password: 'CHANGEME'
    ssh_keyfile_path: '/home/user/.local/share/quipucords/sshkeyfiles/'

# Quipucords / Discovery CLI
quipucords_cli:
    executable: qpc

# HashiCorp Vault server configuration for Discovery Vault integration.
# Cert paths are local file paths. Camayoc configures the server via
# ``qpc vault add`` / ``dsc vault add``, which base64-encodes the certs.
# Required when any credential below uses vault_secret_path.
# hashicorp_vault:
#     address: vault.example.com
#     port: 8200
#     client_cert: /path/to/client.crt
#     client_key: /path/to/client.key
#     ca_cert: /path/to/ca.crt

# We host most of our test machines on a VCenter instance
# and this section contains its URL and the credentials
# needed to log in to it
vcenter:
    hostname: OURTEAMVCENTER.com
    password: "CHANGETHISPASSWORD"
    username: CHANGETHISUSERNAME


# Data-related settings. They cover various entities that camayoc might
# create in Quipucords during test execution. Storing them here allows
# us to simplify scan / report tests, or express requests like "give me
# random working network-type source".

credentials:
    - name: root
      type: 'network'
      # NOTE: When running quipucords in a container, this path
      # must be the path that exists in the container.
      sshkeyfile: ~/.ssh/id_rsa
      username: root
    - name: root2
      type: 'network'
      username: root
      password: "mysecretpassword"
    - name: 'vcenter'
      type: 'vcenter'
      password: 'example1'
      username: 'username1'
    - name: 'sat6'
      type: 'satellite'
      password: 'CHANGEME'
      username: 'CHANGEUSERNAME'
    - name: 'OpenShift'
      type: 'openshift'
      auth_token: 'sha256~XYZabc...'
    - name: 'rhacs'
      type: 'rhacs'
      auth_token: 'these_tend_to_be_very_long'
    - name: 'ansible'
      type: 'ansible'
      username: 'admin'
      password: 'CHANGEME'
    # Vault-backed credentials (require hashicorp_vault server config above):
    # - name: 'OpenShiftVault'
    #   type: 'openshift'
    #   vault_secret_path: vault/dev/ocp-token
    #   vault_secret_key: auth_token
    #   vault_mount_point: discovery
    # - name: 'AnsibleVault'
    #   type: 'ansible'
    #   vault_secret_path: vault/dev/aap-token
    #   vault_secret_key: password
    #   vault_mount_point: discovery

# Values in "credentials" field can use names present in "credentials" section
# above
sources:
    - hosts:
          - 'myfavnetwork.com'
      credentials:
          - root
      name: 'myfav'
      type: 'network'
    - hosts:
          - 'my_vcenter.com'
      credentials:
          - 'vcenter'
      name: 'vcenter'
      type: 'vcenter'
      ssl_cert_verify: false
    - hosts:
          - 'sat6.com'
      credentials:
          - 'sat6'
      name: 'sat6'
      type: 'satellite'
      ssl_cert_verify: false
    - hosts:
          - 'api.example.com'
      credentials:
          - 'OpenShift'
      name: 'OpenShift'
      type: 'openshift'
      ssl_cert_verify: false
    - hosts:
          - 'acs-endpoint.acs.mycluster.com'
      credentials:
          - 'rhacs'
      name: 'RHACS'
      type: 'rhacs'
      ssl_cert_verify: false
    - hosts:
          - 'aap.example.com'
      credentials:
          - 'ansible'
      name: 'ansible'
      type: 'ansible'
      ssl_cert_verify: false
    # Vault-backed source examples (uncomment with Vault credentials above):
    # - hosts:
    #       - 'api.vault-ocp.example.com'
    #   credentials:
    #       - 'OpenShiftVault'
    #   name: 'OpenShiftVault'
    #   type: 'openshift'
    #   ssl_cert_verify: false
    # - hosts:
    #       - 'aap.example.com'
    #   credentials:
    #       - 'AnsibleVault'
    #   name: 'AnsibleVault'
    #   type: 'ansible'
    #   ssl_cert_verify: false

# Values in "sources" field can use names present in "sources" section above
scans:
    - name: ExampleSat6
      sources:
          # these refer to the hostnames in the inventory section
          - 'sat6'
    - name: ExampleWithProducts
      sources:
          - 'myfav'
          - 'vcenter'
      expected_data:
          jbossamq-rhel-5-vc:
              distribution:
                  # Name of OS should be substring of name found
                  # with quipucords
                  name: 'Red Hat Enterprise Linux'
                  # version should be substring of version found
                  # in /etc/redhat-release
                  version: '5.9'
                  release: ''
                  is_redhat: true
          jbossamq-rhel-6-vc:
              distribution:
                  name: 'Red Hat Enterprise Linux'
                  version: '6.9'
                  release: ''
                  is_redhat: true
    - name: OpenShift
      sources:
          - 'OpenShift'
      expected_data:
          OpenShift:
              cluster_id: '00000000-1111-2222-3333-123456789abc'
              version: '4.11.32'
              nodes:
                  - 'master-0.example.com'
                  - 'master-1.example.com'
                  - 'master-2.example.com'
                  - 'worker-0.example.com'
                  - 'worker-1.example.com'
                  - 'worker-2.example.com'
                  - 'worker-3.example.com'
              operators:
                  - 'abc-operator'
                  - 'xyz-operator'
